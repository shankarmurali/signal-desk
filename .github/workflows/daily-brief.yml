name: Daily brief

on:
  schedule:
    # 13:30 UTC ≈ 6:30am Pacific, every day
    - cron: "30 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate brief
        run: python generate_brief.py --window-hours 48 --no-ai

      - name: Commit brief
        run: |
          git config user.name "signal-desk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add briefs/
          git diff --cached --quiet || git commit -m "Daily brief $(date -u +%F)"
          git push
